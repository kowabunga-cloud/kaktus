---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-modules:
        patterns: ["*"]
    ignore:
      # newer releases require librbd APIs unavailable on Ubuntu 24.04
      # LTS, the release packages target
      - dependency-name: github.com/ceph/go-ceph
        versions: [">0.38.0"]
