---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-modules:
        patterns: ["*"]
    ignore:
      # newer releases require Ceph 20.2.1+ librbd APIs, while Ubuntu 26.04
      # LTS, the release packages target, ships Ceph 20.2.0
      - dependency-name: github.com/ceph/go-ceph
        versions: [">0.40.0"]
